name: Automate Creation of Repo for POC Projects

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      teamName:
        description: 'Team Name:'
        required: true
        type: choice
        options:
          - '--CHOOSE--'
          - 'dev'
          - 'prod'
          - 'qa'

      appName:
        description: 'App Name (Unique short name for application) (Lowercase - No Spaces):'
        required: true
        type: string
      repoDescription:
        description: 'Repo Description (Optional):'
        required: false
        type: string
      repoVisibility:
        description: 'Repo Visibility in the Touchdigitalhub:'
        required: true
        default: 'private'
        type: choice
        options:
          - public
          - private
      repoTemplate:
        description: 'Repo QuickStart Template ("Blank" creates an empty repo):'
        required: true
        default: 'blank'
        type: choice
        options:
          - monorepo
          - aws
          - azure
          - openshift
          - blank
      devTeamName:
        description: 'GitHub Org Team Name:'
        required: true
        default: 'FILL_HERE'
        type: string
      approverTeamName:
        description: 'GitHub PR Approval Team Name:'
        required: true
        default: 'FILL_HERE'
        type: string


jobs:
  createGitHubRepo:
    name: Create GitHub Repo
    runs-on: ubuntu

    env:
      RepoName: ${{ inputs.teamName }}-${{ inputs.appName }}

    steps:
      # Checkout just the github folder from the Repo
      - name: Checkout Scripts from Repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            github
      
    # Whats in our workspace folder?
      - name: Workspace folder contents
        run: |
          ls -lah ./

      # Do some repo name variable cleanup
      - name: RepoName should be all lower case
        run: echo "RepoName=${RepoName@L}" >> "${GITHUB_ENV}"
      - name: RepoName should contain no spaces replace with "-"
        run: echo "RepoName=${RepoName// /-}" >> "${GITHUB_ENV}"
      
      # Run the GitHub Repo Create Script
      - name: Run Create GitHub Repo Script
        run: |
            chmod +x ./github/monorepo.sh
            bash -File ./github/monorepo.sh

      
      # Add some information to the Workflow's Summary.
      - name: Update GitHub Workflow's Summary - On Success
        if: success()
        run: |
          echo "### :octocat: Repo (touchdigitalhub/${{ env.RepoName }}) Successfully Created!" >> $GITHUB_STEP_SUMMARY
          echo "You can access it here: https://github.com/touchdigitalhub/${{ env.RepoName }}" >> $GITHUB_STEP_SUMMARY
      
      # Add some information to the Workflow's Summary.
      - name: Update GitHub Workflow's Summary - On Failure
        if: failure()
        run: |
          echo "### :x: Failed to Create Repo!" >> $GITHUB_STEP_SUMMARY
          echo "Please review the logs above to diagnose what went wrong." >> $GITHUB_STEP_SUMMARY
