name: Automate Creation of Repo for POC Projects

on:
  workflow_dispatch:
    inputs:
      teamName:
        description: Team Name
        required: true
        type: choice
        options:
          - dev
          - prod
          - qa

      appName:
        description: Application Name (lowercase, no spaces)
        required: true
        type: string

      repoDescription:
        description: Repository Description
        required: false
        type: string

      repoVisibility:
        description: Repository Visibility
        required: true
        default: private
        type: choice
        options:
          - public
          - private

      repoTemplate:
        description: Repository Template
        required: true
        default: monorepo
        type: choice
        options:
          - monorepo
          - aws
          - azure
          - openshift
          - blank

      devTeamName:
        description: Developer Team
        required: true
        type: string

      approverTeamName:
        description: Approver Team
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-repository:
    name: Create Repository
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}

    steps:

      - name: Checkout Provisioning Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        shell: bash
        run: |

          if ! [[ "${{ inputs.appName }}" =~ ^[a-z0-9-]+$ ]]
          then
            echo "Application name must contain only lowercase letters and hyphens."
            exit 1
          fi

      - name: Generate Repository Name
        shell: bash
        run: |

          REPO_NAME="${{ inputs.teamName }}-${{ inputs.appName }}"
          REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=${REPO_NAME// /-}

          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Check Repository Does Not Exist
        shell: bash
        run: |

          if gh repo view "touchdigitalhub/${REPO_NAME}" >/dev/null 2>&1
          then
            echo "Repository already exists."
            exit 1
          fi

      - name: Create GitHub Repository
        shell: bash
        run: |

          if [[ "${{ inputs.repoVisibility }}" == "private" ]]
          then
            VISIBILITY="--private"
          else
            VISIBILITY="--public"
          fi

          gh repo create \
            "touchdigitalhub/${REPO_NAME}" \
            $VISIBILITY \
            --description "${{ inputs.repoDescription }}"

      - name: Clone New Repository
        shell: bash
        run: |

          gh repo clone \
            "touchdigitalhub/${REPO_NAME}" \
            "./${REPO_NAME}"

      - name: Execute Scaffolder
        shell: bash
        env:
          REPO_TEMPLATE: ${{ inputs.repoTemplate }}
          DEV_TEAM: ${{ inputs.devTeamName }}
          APPROVER_TEAM: ${{ inputs.approverTeamName }}
        run: |

          chmod +x ./github/monorepo.sh

          ./github/monorepo.sh \
            "${REPO_NAME}" \
            "./${REPO_NAME}"

      - name: Commit Scaffold
        shell: bash
        run: |

          cd "${REPO_NAME}"

          git config user.name "Francis A"
          git config user.email "adeboye.francis@icloud.com"

          git add .

          if git diff --cached --quiet
          then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Initial repository scaffold"

          git push origin main

      - name: Success Summary
        if: success()
        run: |

          echo "## ✅ Repository Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${REPO_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/touchdigitalhub/${REPO_NAME}" >> $GITHUB_STEP_SUMMARY

      - name: Failure Summary
        if: failure()
        run: |

          echo "## ❌ Repository Creation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review workflow logs for details." >> $GITHUB_STEP_SUMMARY
